<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compact Audio Player</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #1a1a40, #0d0d26); /* First player background */
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .player {
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      max-width: 320px;
    }

    .player img {
      width: 220px;   /* Bigger image */
      height: 220px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 13px;
      color: #bbb;
      margin-bottom: 15px;
    }

    audio {
      width: 100%;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="player">
    <img src="c.jpg" alt="Cover">
    <div class="title">Think Again</div>
    <div class="subtitle">Written & Narrated by Adam Grant</div>
    <audio controls>
      <source src="https://cdn001.milotree.com/files/9d949c3d8baa0f9df6f22c4661946a61/2763/AUDIOBOOK-BusyMansFitness.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </div>
</body>
</html>
