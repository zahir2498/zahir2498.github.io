<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Think Again - Audio Player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #000;
    }

    .audio-player {
      width: 100%;
      height: 100vh; /* full screen */
      display: flex;
      flex-direction: column;
    }

    .banner {
      flex: 1; /* image takes available space */
      position: relative;
      width: 100%;
      height: 100%;
    }

    .banner img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* makes image behave like cover background */
    }

    .banner-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
      color: #fff;
    }

    .banner-overlay h2 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .banner-overlay p {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .player-controls {
      background: #fff;
      padding: 20px;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.3);
    }

    .chapter-info {
      text-align: center;
      margin-bottom: 15px;
    }

    .chapter-info h3 {
      font-size: 1rem;
      color: #444;
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    .progress-container {
      width: 100%;
      height: 6px;
      background: #ddd;
      border-radius: 5px;
      margin-bottom: 15px;
      cursor: pointer;
    }

    .progress {
      height: 100%;
      background: linear-gradient(to right, #6e8efb, #a777e3);
      width: 0%;
      border-radius: 5px;
    }

    .controls-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 15px;
    }

    .btn {
      background: none;
      border: none;
      cursor: pointer;
    }

    .btn-play {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6e8efb, #a777e3);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 15px rgba(106, 142, 251, 0.4);
    }

    .btn-play i {
      font-size: 26px;
      color: #fff;
    }

    .btn-skip {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
    }

    .volume-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .volume-slider {
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="audio-player">
    <div class="banner">
      <img id="banner-image" src="c.jpg" alt="Audio Banner">
      <div class="banner-overlay">
        <h2 id="audio-title">The Busy Man's Fitness Plan After 50</h2>
        <p id="audio-author">Written by Peter Michaels | Narrated by Garan Patrick</p>
      </div>
    </div>

    <div class="player-controls">
      <div class="chapter-info">
        <h3>The Busy Man's Fitness Plan After 50</h3>
      </div>

      <div class="time-display">
        <span id="current-time">00:00:00</span>
        <span id="duration">00:00:00</span>
      </div>

      <div class="progress-container" id="progress-container">
        <div class="progress" id="progress"></div>
      </div>

      <div class="controls-row">
        <button class="btn btn-skip" id="backward"><i class="fas fa-backward"></i></button>
        <button class="btn btn-play" id="play"><i class="fas fa-play" id="play-icon"></i></button>
        <button class="btn btn-skip" id="forward"><i class="fas fa-forward"></i></button>
      </div>

      <div class="controls-row">
        <button class="btn" id="speed-btn"><i class="fas fa-running"></i> 1.0x</button>
        <div class="volume-controls">
          <i class="fas fa-volume-high"></i>
          <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.01" value="0.7">
        </div>
      </div>
    </div>

    <audio id="audio"></audio>
  </div>

  <script>
    const audio = document.getElementById("audio");
    const playBtn = document.getElementById("play");
    const playIcon = document.getElementById("play-icon");
    const progress = document.getElementById("progress");
    const progressContainer = document.getElementById("progress-container");
    const currentTimeEl = document.getElementById("current-time");
    const durationEl = document.getElementById("duration");
    const volumeSlider = document.getElementById("volume");
    const speedBtn = document.getElementById("speed-btn");

    audio.src = "https://cdn001.milotree.com/files/9d949c3d8baa0f9df6f22c4661946a61/2763/AUDIOBOOK-BusyMansFitness.mp3";

    // Play/Pause
    playBtn.addEventListener("click", () => {
      if (audio.paused) {
        audio.play();
        playIcon.classList.replace("fa-play", "fa-pause");
      } else {
        audio.pause();
        playIcon.classList.replace("fa-pause", "fa-play");
      }
    });

    // Progress update
    audio.addEventListener("timeupdate", () => {
      const progressPercent = (audio.currentTime / audio.duration) * 100;
      progress.style.width = `${progressPercent}%`;

      const format = (time) =>
        new Date(time * 1000).toISOString().substring(11, 19);

      currentTimeEl.textContent = format(audio.currentTime);
      durationEl.textContent = format(audio.duration);
    });

    // Seek
    progressContainer.addEventListener("click", (e) => {
      const width = progressContainer.clientWidth;
      const clickX = e.offsetX;
      audio.currentTime = (clickX / width) * audio.duration;
    });

    // Volume
    volumeSlider.addEventListener("input", () => {
      audio.volume = volumeSlider.value;
    });

    // Speed
    const speeds = [0.75, 1.0, 1.25, 1.5, 2.0];
    let speedIndex = 1;
    speedBtn.addEventListener("click", () => {
      speedIndex = (speedIndex + 1) % speeds.length;
      audio.playbackRate = speeds[speedIndex];
      speedBtn.innerHTML = `<i class="fas fa-running"></i> ${speeds[speedIndex]}x`;
    });
  </script>
</body>
</html>
