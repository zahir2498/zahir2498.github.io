<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loop 1</title>

<style>

*{box-sizing:border-box;}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
background:#fbfbfd;
margin:0;
padding:40px 20px;
display:flex;
flex-direction:column;
align-items:center;
color:#1d1d1f;
}

h1{
font-size:26px;
font-weight:600;
margin-bottom:20px;
}

/* banner */

.loop-image{
width:100%;
max-width:760px;
border-radius:14px;
margin-bottom:26px;
}

/* player */

.player{
width:100%;
max-width:760px;
}

/* row */

.player-row{
display:flex;
align-items:center;
gap:12px;
}

/* play */

.play-btn{
width:40px;
height:40px;
border-radius:50%;
background:#007aff;
color:white;
font-size:20px;
border:none;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

/* progress container */

.progress-container{
position:relative;
flex:1;
height:8px;
background:#e6e6eb;
border-radius:10px;
}

/* slider */

.progress{
-webkit-appearance:none;
appearance:none;
width:100%;
height:8px;
background:transparent;
outline:none;
cursor:pointer;
position:relative;
z-index:3;
}

.progress::-webkit-slider-thumb{
-webkit-appearance:none;
width:18px;
height:18px;
border-radius:50%;
background:#007aff;
border:2px solid white;
margin-top:-5px;
}

/* loop highlight */

.loop-region{
position:absolute;
top:0;
height:8px;
background:rgba(0,122,255,.35);
border-radius:10px;
display:none;
z-index:1;
}

/* markers */

.marker{
position:absolute;
top:50%;
transform:translate(-50%,-50%);
width:4px;
height:22px;
background:#007aff;
border-radius:3px;
display:none;
z-index:2;
}

/* time row */

.time-row{
display:flex;
align-items:center;
justify-content:space-between;
margin-top:10px;
font-size:14px;
color:#6e6e73;
}

/* controls */

.middle-controls{
display:flex;
align-items:center;
gap:16px;
}

.loop-toggle{
display:flex;
align-items:center;
gap:6px;
font-size:13px;
}

.loop-toggle input{
accent-color:#007aff;
}

#speedSelect{
border:1px solid #d9d9e3;
border-radius:20px;
padding:4px 12px;
}

.controls{
display:flex;
justify-content:center;
gap:8px;
margin-top:18px;
flex-wrap:wrap;
}

.btn{
padding:6px 12px;
border-radius:30px;
border:1px solid #d9d9e3;
background:#fff;
cursor:pointer;
}

/* flashcards */

.flash-section{
width:100%;
max-width:760px;
margin-top:50px;
}

.flash-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

.card{
perspective:1000px;
cursor:pointer;
}

.card-inner{
position:relative;
width:100%;
height:140px;
transition:transform .6s;
transform-style:preserve-3d;
}

.card.flip .card-inner{
transform:rotateY(180deg);
}

.card-front,
.card-back{
position:absolute;
width:100%;
height:100%;
backface-visibility:hidden;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
text-align:center;
}

.card-front{
background:white;
border:1px solid #eee;
}

.card-back{
background:#007aff;
color:white;
transform:rotateY(180deg);
}

/* responsive */

@media(max-width:600px){

body{
padding:20px 12px;
}

.player-row{
gap:8px;
}

.play-btn{
width:34px;
height:34px;
font-size:16px;
}

}

</style>
</head>

<body>

<h1>Loop 1</h1>

<img src="https://github.com/zahir2498/zahir2498.github.io/blob/main/images/image.jpeg?raw=true" class="loop-image">

<div class="player">

<div class="player-row">

<button class="play-btn" id="playBtn">▶</button>

<div class="progress-container">

<div id="loopRegion" class="loop-region"></div>
<div id="markerA" class="marker"></div>
<div id="markerB" class="marker"></div>

<input type="range" id="progress" class="progress" value="0" min="0" max="100">

</div>

</div>

<div class="time-row">

<span id="current">0:00</span>

<div class="middle-controls">

<label class="loop-toggle">
<input type="checkbox" id="loopCheck"> Loop
</label>

<select id="speedSelect">
<option value="0.25">0.25×</option>
<option value="0.5">0.5×</option>
<option value="0.75">0.75×</option>
<option value="1" selected>1×</option>
<option value="1.25">1.25×</option>
<option value="1.5">1.5×</option>
<option value="1.75">1.75×</option>
<option value="2">2×</option>
</select>

</div>

<span id="duration">0:00</span>

</div>

<div class="controls">

<button class="btn" id="setA">SetA</button>
<button class="btn" id="setB">SetB</button>
<button class="btn" id="clearA">ClearA</button>
<button class="btn" id="clearB">ClearB</button>
<button class="btn" id="clearAB">ClearA/B</button>

</div>

<audio id="audio" src="/audio/loop_000001.wav"></audio>

</div>


<!-- FLASHCARDS -->

<div class="flash-section">

<h2>Flashcards</h2>

<div class="flash-grid">

<div class="card" onclick="this.classList.toggle('flip')">
<div class="card-inner">
<div class="card-front">a veces</div>
<div class="card-back">sometimes</div>
</div>
</div>

<div class="card" onclick="this.classList.toggle('flip')">
<div class="card-inner">
<div class="card-front">encima</div>
<div class="card-back">on top of</div>
</div>
</div>

<div class="card" onclick="this.classList.toggle('flip')">
<div class="card-inner">
<div class="card-front">fractura</div>
<div class="card-back">fracture</div>
</div>
</div>

<div class="card" onclick="this.classList.toggle('flip')">
<div class="card-inner">
<div class="card-front">asegurada</div>
<div class="card-back">guaranteed</div>
</div>
</div>

</div>

</div>


<script>

const audio=document.getElementById("audio")
const playBtn=document.getElementById("playBtn")
const progress=document.getElementById("progress")

const current=document.getElementById("current")
const duration=document.getElementById("duration")

const markerAEl=document.getElementById("markerA")
const markerBEl=document.getElementById("markerB")
const loopRegion=document.getElementById("loopRegion")

const setA=document.getElementById("setA")
const setB=document.getElementById("setB")
const clearA=document.getElementById("clearA")
const clearB=document.getElementById("clearB")
const clearAB=document.getElementById("clearAB")

const loopCheck=document.getElementById("loopCheck")
const speedSelect=document.getElementById("speedSelect")

let markerA=null
let markerB=null

function formatTime(sec){
const m=Math.floor(sec/60)
const s=Math.floor(sec%60)
return m+":"+(s<10?"0":"")+s
}

audio.addEventListener("loadedmetadata",()=>{
duration.textContent=formatTime(audio.duration)
progress.max=audio.duration
})

playBtn.onclick=()=>{
if(audio.paused){
audio.play()
playBtn.textContent="❚❚"
}else{
audio.pause()
playBtn.textContent="▶"
}
}

audio.addEventListener("timeupdate",()=>{

progress.value=audio.currentTime
current.textContent=formatTime(audio.currentTime)

if(loopCheck.checked && markerA!==null && markerB!==null){

let start=Math.min(markerA,markerB)
let end=Math.max(markerA,markerB)

if(audio.currentTime>=end){
audio.currentTime=start
}

}

})

progress.oninput=()=>{
audio.currentTime=progress.value
}

speedSelect.onchange=()=>{
audio.playbackRate=parseFloat(speedSelect.value)
}

function updateMarker(time,el){
if(!audio.duration)return
const percent=(time/audio.duration)*100
el.style.left=percent+"%"
el.style.display="block"
}

function updateRegion(){

if(markerA!==null && markerB!==null){

let start=(Math.min(markerA,markerB)/audio.duration)*100
let end=(Math.max(markerA,markerB)/audio.duration)*100

loopRegion.style.left=start+"%"
loopRegion.style.width=(end-start)+"%"
loopRegion.style.display="block"

}else{
loopRegion.style.display="none"
}

}

setA.onclick=()=>{
markerA=audio.currentTime
updateMarker(markerA,markerAEl)
updateRegion()
}

setB.onclick=()=>{
markerB=audio.currentTime
updateMarker(markerB,markerBEl)
updateRegion()
}

clearA.onclick=()=>{
markerA=null
markerAEl.style.display="none"
updateRegion()
}

clearB.onclick=()=>{
markerB=null
markerBEl.style.display="none"
updateRegion()
}

clearAB.onclick=()=>{
markerA=null
markerB=null
markerAEl.style.display="none"
markerBEl.style.display="none"
updateRegion()
}

</script>

</body>
</html>
