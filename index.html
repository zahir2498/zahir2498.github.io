<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loop 1</title>

<style>

*{box-sizing:border-box;}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
background:#fbfbfd;
margin:0;
padding:40px 20px;
display:flex;
flex-direction:column;
align-items:center;
color:#1d1d1f;
}

h1{
font-size:26px;
font-weight:600;
margin-bottom:22px;
}

/* Banner Image */

.loop-image{
width:100%;
max-width:760px;
height:auto;
border-radius:16px;
margin-bottom:26px;
}

/* Player Width */

.player{
width:720px;
max-width:95%;
}

/* Player Row */

.player-row{
display:flex;
align-items:center;
gap:12px;
}

/* Play Button */

.play-btn{
width:40px;
height:40px;
border-radius:50%;
background:#007aff;
color:white;
font-size:22px;
border:none;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

.play-btn:hover{
background:#005fc7;
}

/* Progress */

.progress-container{
position:relative;
flex:1;
}

.progress{
-webkit-appearance:none;
width:100%;
height:8px;
border-radius:10px;
background:#e6e6eb;
outline:none;
cursor:pointer;
}

.progress::-webkit-slider-thumb{
-webkit-appearance:none;
width:18px;
height:18px;
border-radius:50%;
background:#007aff;
border:2px solid white;
box-shadow:0 2px 6px rgba(0,0,0,0.2);
margin-top:-5px;
}

/* Loop Region */

.loop-region{
position:absolute;
top:50%;
transform:translateY(-50%);
height:8px;
background:rgba(0,122,255,.35);
border-radius:10px;
display:none;
}

/* Markers */

.marker{
position:absolute;
top:50%;
transform:translate(-50%,-50%);
width:4px;
height:22px;
background:#007aff;
border-radius:3px;
display:none;
}

/* Time Row */

.time-row{
display:flex;
align-items:center;
justify-content:space-between;
margin-top:10px;
font-size:14px;
color:#6e6e73;
}

/* Middle Controls */

.middle-controls{
display:flex;
align-items:center;
gap:16px;
}

/* Loop Toggle */

.loop-toggle{
display:flex;
align-items:center;
gap:6px;
font-size:13px;
color:#6e6e73;
font-weight:500;
}

.loop-toggle input{
width:16px;
height:16px;
accent-color:#007aff;
cursor:pointer;
}

/* Speed Dropdown (no label text) */

#speedSelect{
border:1px solid #d9d9e3;
border-radius:20px;
padding:4px 12px;
font-size:13px;
background:white;
cursor:pointer;
}

/* Bottom Buttons */

.controls{
display:flex;
align-items:center;
justify-content:center;
gap:8px;
margin-top:18px;
flex-wrap:wrap;
}

.btn{
padding:6px 12px;
border-radius:30px;
border:1px solid #d9d9e3;
background:#fff;
font-size:13px;
cursor:pointer;
}

.btn:hover{
border-color:#007aff;
color:#007aff;
}

#audio{
display:none;
}

/* Mobile */

@media(max-width:600px){

.time-row{
flex-wrap:wrap;
gap:6px;
justify-content:center;
}

.middle-controls{
order:3;
}

}

</style>
</head>

<body>

<h1>Loop 1</h1>

<img src="https://github.com/zahir2498/zahir2498.github.io/blob/main/images/image.jpeg?raw=true" class="loop-image">

<div class="player">

<div class="player-row">

<div class="play-btn" id="playBtn">▶</div>

<div class="progress-container">

<div id="loopRegion" class="loop-region"></div>
<div id="markerA" class="marker"></div>
<div id="markerB" class="marker"></div>

<input type="range" id="progress" class="progress" value="0" min="0" max="100" step="any">

</div>

</div>

<div class="time-row">

<span id="current">0:00</span>

<div class="middle-controls">

<label class="loop-toggle">
<input type="checkbox" id="loopCheck">
<span>Loop</span>
</label>

<select id="speedSelect">
<option value="0.25">0.25×</option>
<option value="0.5">0.5×</option>
<option value="0.75">0.75×</option>
<option value="1" selected>1×</option>
<option value="1.25">1.25×</option>
<option value="1.5">1.5×</option>
<option value="1.75">1.75×</option>
<option value="2">2×</option>
</select>

</div>

<span id="duration">0:00</span>

</div>

<div class="controls">

<button class="btn" id="setA">SetA</button>
<button class="btn" id="setB">SetB</button>

<button class="btn" id="clearA">ClearA</button>
<button class="btn" id="clearB">ClearB</button>
<button class="btn" id="clearAB">ClearA/B</button>

</div>

<audio id="audio" src="/audio/loop_000001.wav" preload="metadata"></audio>

</div>

<script>

const audio=document.getElementById("audio")
const playBtn=document.getElementById("playBtn")
const progress=document.getElementById("progress")

const current=document.getElementById("current")
const duration=document.getElementById("duration")

const setA=document.getElementById("setA")
const setB=document.getElementById("setB")
const clearA=document.getElementById("clearA")
const clearB=document.getElementById("clearB")
const clearAB=document.getElementById("clearAB")

const markerAEl=document.getElementById("markerA")
const markerBEl=document.getElementById("markerB")
const loopRegion=document.getElementById("loopRegion")

const speedSelect=document.getElementById("speedSelect")
const loopCheck=document.getElementById("loopCheck")

let markerA=null
let markerB=null

function formatTime(sec){
const m=Math.floor(sec/60)
const s=Math.floor(sec%60)
return m+":"+(s<10?"0":"")+s
}

audio.addEventListener("loadedmetadata",()=>{
duration.textContent=formatTime(audio.duration)
progress.max=audio.duration
})

playBtn.onclick=()=>{
if(audio.paused){
audio.play()
playBtn.textContent="❚❚"
}else{
audio.pause()
playBtn.textContent="▶"
}
}

audio.addEventListener("timeupdate",()=>{

progress.value=audio.currentTime
current.textContent=formatTime(audio.currentTime)

if(loopCheck.checked && markerA!==null && markerB!==null){

let start=Math.min(markerA,markerB)
let end=Math.max(markerA,markerB)

if(audio.currentTime>=end){
audio.currentTime=start
}

}

})

progress.oninput=()=>{
audio.currentTime=progress.value
}

speedSelect.onchange=()=>{
audio.playbackRate=parseFloat(speedSelect.value)
}

function updateMarker(time,el){
const percent=(time/audio.duration)*100
el.style.left=percent+"%"
el.style.display="block"
}

function updateRegion(){

if(markerA!==null && markerB!==null){

let start=(Math.min(markerA,markerB)/audio.duration)*100
let end=(Math.max(markerA,markerB)/audio.duration)*100

loopRegion.style.left=start+"%"
loopRegion.style.width=(end-start)+"%"
loopRegion.style.display="block"

}else{

loopRegion.style.display="none"

}

}

setA.onclick=()=>{
markerA=audio.currentTime
updateMarker(markerA,markerAEl)
updateRegion()
}

setB.onclick=()=>{
markerB=audio.currentTime
updateMarker(markerB,markerBEl)
updateRegion()
}

clearA.onclick=()=>{
markerA=null
markerAEl.style.display="none"
updateRegion()
}

clearB.onclick=()=>{
markerB=null
markerBEl.style.display="none"
updateRegion()
}

clearAB.onclick=()=>{
markerA=null
markerB=null
markerAEl.style.display="none"
markerBEl.style.display="none"
updateRegion()
}

</script>

</body>
</html>
